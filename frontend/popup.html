<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 350px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 15px;
      margin: 0;
      background-color: #f9f9f9;
    }
    h3 {
      margin-top: 0;
      color: #ff0000; /* YouTube Red */
      text-align: center;
      border-bottom: 2px solid #ddd;
      padding-bottom: 10px;
    }
    #chat-box {
      height: 300px;
      overflow-y: auto;
      background: white;
      border: 1px solid #ccc;
      border-radius: 5px;
      padding: 10px;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .message {
      padding: 8px 12px;
      border-radius: 15px;
      max-width: 80%;
      word-wrap: break-word;
      font-size: 14px;
    }
    .user-msg {
      background-color: #007bff;
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 2px;
    }
    .bot-msg {
      background-color: #e9ecef;
      color: black;
      align-self: flex-start;
      border-bottom-left-radius: 2px;
    }
    .error-msg {
      background-color: #ffdddd;
      color: #d8000c;
      align-self: center;
      font-size: 12px;
    }
    #input-area {
      display: flex;
      gap: 5px;
    }
    input {
      flex: 1;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      padding: 8px 15px;
      background-color: #ff0000;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background-color: #cc0000;
    }
    #loading {
      display: none;
      font-size: 12px;
      color: #666;
      text-align: center;
      font-style: italic;
    }
  </style>
</head>
<body>
  <h3>YT Chatbot</h3>
  
  <div id="chat-box">
    <div class="message bot-msg">Hello! Open a YouTube video and ask me anything about it.</div>
  </div>
  
  <div id="loading">Thinking...</div>
  
  <div id="input-area">
    <input type="text" id="user-input" placeholder="Ask about this video..." autocomplete="off" />
    <button id="send-btn">Send</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
